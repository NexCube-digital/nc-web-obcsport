<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: tipe disesuaikan dengan format file (webp) -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <meta name="theme-color" content="#404F14" />

    <!-- SEO dasar -->
    <title>OBC Sport — Booking Fasilitas Olahraga Online</title>
    <meta
      name="description"
      content="Booking online lapangan futsal, badminton, pickleball, basket, sepak bola, tenis meja & biliard di Onny Barber Center. Cek jadwal real-time, bayar via Midtrans."
    />
    <meta
      name="keywords"
      content="OBC Sport, Onny Barber Center, booking lapangan, sewa lapangan futsal, badminton, pickleball, basket, tenis meja, biliard, sewa gedung, membership olahraga"
    />
    <meta name="author" content="Onny Barber Center" />
    <!-- TODO: ganti dengan domain asli OBC Sport -->
    <link rel="canonical" href="https://obcsport.com/" />

    <!-- Open Graph: dipakai WhatsApp, Facebook, Telegram, LinkedIn saat link dibagikan -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OBC Sport" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:url" content="https://obcsport.com/" />
    <meta property="og:title" content="OBC Sport — Booking Fasilitas Olahraga Online" />
    <meta
      property="og:description"
      content="Booking lapangan futsal, badminton, pickleball, basket, tenis meja & biliard di Onny Barber Center. Cek jadwal real-time, sewa gedung, dan membership."
    />
    <!-- Wajib URL absolut (https://...), bukan path relatif. Ukuran ideal 1200x630, di bawah 300 KB -->
    <meta property="og:image" content="https://obcsport.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://obcsport.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OBC Sport — Booking Fasilitas Olahraga Onny Barber Center" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OBC Sport — Booking Fasilitas Olahraga Online" />
    <meta
      name="twitter:description"
      content="Booking lapangan futsal, badminton, pickleball, basket, tenis meja & biliard di Onny Barber Center."
    />
    <meta name="twitter:image" content="https://obcsport.com/og-image.png" />

    <!-- Preload font (Montserrat dipakai di UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
